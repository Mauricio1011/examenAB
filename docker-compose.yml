services:
  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  parcel-mongo-service:
    build: ./parcel-mongo-service
    ports:
      - "8081:8081"
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/huertos
    depends_on:
      mongodb:
        condition: service_healthy
    restart: on-failure

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: parcels
      POSTGRES_USER: parcels
      POSTGRES_PASSWORD: parcels
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parcels -d parcels"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  parcel-postgres-service:
    build: ./parcel-postgres-service
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/parcels
      SPRING_DATASOURCE_USERNAME: parcels
      SPRING_DATASOURCE_PASSWORD: parcels
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure
