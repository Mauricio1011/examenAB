server:
  port: 8081
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never

spring:
  application:
    name: parcel-mongo-service
  data:
    mongodb:
      uri: mongodb://localhost:27017/huertos
      auto-index-creation: true
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false
  jackson:
    serialization:
      write-dates-as-timestamps: false

logging:
  level:
    com.huertos.parcelmongo: INFO
